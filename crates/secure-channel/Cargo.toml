[package]
name = "suzushiro-secure-channel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Versioned proof handshake and ordered XChaCha20-Poly1305 frames"
publish = false

[dependencies]
blake2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
thiserror = "2.0.20"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
