[package]
name = "suzushiro-controlled-root"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform controlled filesystem root with strict path and link boundaries"
publish = false

[dependencies]
thiserror = "2.0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
getrandom = "0.4.3"
