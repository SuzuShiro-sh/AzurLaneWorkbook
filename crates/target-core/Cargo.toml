[package]
name = "suzushiro-target-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Opaque target identifiers, lifecycle states, and canonical target fingerprints"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
suzushiro-text-format = { version = "0.1.0", path = "../text-format" }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
